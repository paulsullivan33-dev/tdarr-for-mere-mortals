site_name: Tdarr for Mere Mortals
site_description: A distributed transcode system that holds a media library to a standard you set. One server keeping the catalogue and the queue, nodes on your own machines doing the converting with ffmpeg, small wired flows of checks and actions deciding what each file needs, and every result proven with a probe before the original is replaced, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/tdarr-for-mere-mortals/
copyright: 'Part of <a href="https://paulsullivan33-dev.github.io/mere-mortals/">For Mere Mortals</a> · Text <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, code MIT'

